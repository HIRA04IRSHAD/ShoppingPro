<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopAI | Intelligent Shopping Agent</title>
    <meta name="description" content="ShopAI live demo: natural language product search, budget detection and deal scoring, running fully in your browser with Pyodide.">
    <!-- GitHub Pages version of templates/index.html (the Flask app still uses that file) -->
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Demo note (GitHub Pages only) */
        .demo-note {
            position: relative; z-index: 1;
            max-width: 1400px; margin: 0 auto;
            padding: 0 28px 24px;
            text-align: center;
            font-size: 12px; color: var(--muted);
        }
        .demo-note a { color: var(--accent); text-decoration: none; }
        .demo-note a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-grid"></div>
    <div class="bg-blob blob1"></div>
    <div class="bg-blob blob2"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-inner">
            <div class="nav-logo">
                <div class="logo-icon"><i class="fa-solid fa-robot"></i></div>
                <span class="logo-text">Shop<em>AI</em></span>
            </div>
            <div class="nav-badge">
                <span class="pulse-dot"></span>
                <span id="stats">50+ Products Live</span>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <main class="main-layout">

        <!-- Chat Panel -->
        <aside class="chat-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    AI Assistant
                </div>
                <span class="status-badge">Online</span>
            </div>

            <div id="chat-box" class="chat-box">
                <div class="msg ai-msg">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-bubble">Hello! I'm your ShopAI agent. Try: <strong>"Best phone under 20000"</strong></div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-row">
                    <input type="text" id="user-input" class="chat-input" placeholder="Ask ShopAI anything...">
                    <button onclick="sendMessage()" class="send-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <div class="quick-chips">
                    <button class="chip" onclick="quickSearch('Best deals today')">🔥 Best Deals</button>
                    <button class="chip" onclick="quickSearch('Phones under 15000')">📱 Phones</button>
                    <button class="chip" onclick="quickSearch('Laptops')">💻 Laptops</button>
                </div>
            </div>
        </aside>

        <!-- Product Panel -->
        <section class="product-panel">

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="sort-wrap">
                        <i class="fa-solid fa-sliders sort-icon"></i>
                        <select id="sort-filter" onchange="applySorting()" class="sort-select">
                            <option value="deal">Best Deals First</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                        </select>
                    </div>
                </div>
                <div class="result-label" id="result-count">Showing Featured Products</div>
            </div>

            <!-- Grid (replaced by products once the Python engine is ready) -->
            <div id="product-grid" class="product-grid">
                <div class="empty-state" id="engine-status">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Loading the Python engine…</p>
                </div>
            </div>

        </section>
    </main>

    <footer class="demo-note">
        Demo running fully in your browser with Pyodide.
        Source: <a href="https://github.com/HIRA04IRSHAD/ShoppingPro" target="_blank" rel="noopener">github.com/HIRA04IRSHAD/ShoppingPro</a>
    </footer>

    <!-- Python in the browser: the same .py files the Flask app uses -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <script>
        const PYTHON_DIR = '/home/pyodide';
        const PYTHON_FILES = ['assistant.py', 'recommender.py', 'deal_score.py', 'db_manager.py', 'products.json'];

        async function fetchFile(name) {
            const response = await fetch(name);
            if (!response.ok) {
                throw new Error(`Could not load ${name} (HTTP ${response.status})`);
            }
            return new Uint8Array(await response.arrayBuffer());
        }

        async function startPythonEngine() {
            const [pyodide, ...files] = await Promise.all([
                loadPyodide(),
                ...PYTHON_FILES.map(fetchFile)
            ]);

            pyodide.FS.mkdirTree(PYTHON_DIR);
            PYTHON_FILES.forEach((name, i) => {
                pyodide.FS.writeFile(`${PYTHON_DIR}/${name}`, files[i]);
            });

            // Same as the /search route in app.py, just without Flask
            pyodide.runPython(`
import os
import sys

os.chdir("${PYTHON_DIR}")
sys.path.insert(0, "${PYTHON_DIR}")

from db_manager import db
from assistant import handle_query


def run_query(query):
    try:
        return handle_query(query, db.get_all_products())
    except Exception as e:
        return {"status": "error", "message": str(e)}
`);
            return pyodide.globals.get('run_query');
        }

        const pythonEngine = startPythonEngine();

        pythonEngine.catch(error => {
            console.error("Could not start the Python engine:", error);
            const badge = document.querySelector('.status-badge');
            if (badge) badge.textContent = 'Offline';
            const status = document.getElementById('engine-status');
            if (status) {
                status.innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <p>Could not load the Python engine. Please refresh the page.</p>`;
            }
        });

        // script.js uses this instead of fetch('/search') when it exists
        window.shopaiQuery = async function(query) {
            const runQuery = await pythonEngine;
            const result = runQuery(query);
            try {
                return result.toJs({dict_converter: Object.fromEntries});
            } finally {
                result.destroy();
            }
        };
    </script>

    <script src="static/js/script.js"></script>
    <script>
        // Quick chip search
        function quickSearch(query) {
            document.getElementById('user-input').value = query;
            sendMessage();
        }

    </script>
</body>
</html>
